config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # --- TFStudio: generated / data / vendored / non-app code (not hand-maintained logic) ---
  # One file per language, named by its locale code, each ~4k lines of i18n
  # string/function data rather than logic. Four parallel translations of the
  # same key tree are duplication by definition. index.js is NOT excluded: it
  # holds the registry and the English fill-in, which are logic.
  "**/constants/locales/??.js",
  "**/materials/materialDatabase.js",     # generated by tools/gen_material_db.py
  "**/coatingLibrary/builtin/**",         # coating entry records (layers, bands, claims), data not logic
  "**/reference/refractiveindex-db/**",   # vendored CC0 refractive-index database clone
  "**/docs-site/**",                      # Astro documentation site, not application code
  "**/web/dist/**",                       # bundled web-demo output
  "**/tools/**",                          # dev/build scripts (locale-editor, generators), not shipped
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
