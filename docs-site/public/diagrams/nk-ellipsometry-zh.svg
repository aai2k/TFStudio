<svg xmlns="http://www.w3.org/2000/svg" width="800" height="316" viewBox="0 0 800 316" role="img" aria-labelledby="t d">
<title id="t">单层膜的反射式椭偏测量</title>
<desc id="d">偏振光以相对法线的已知角度入射到镀膜面。探测器读取反射光束偏振态的变化，由此得到 Ψ 和 Δ。不测量透射。</desc>
<style>
  /* No background is painted, so the page shows through in either theme, and
     the colours are read from the viewer's own light or dark setting. */
  text { font-family: system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif; fill: #1c3350; }
  .dim { fill: #5a6b80; }
  .beam { stroke: #1b7fb5; fill: none; stroke-width: 3; }
  .rule { stroke: #8494a6; fill: none; }
  .film { fill: #c08c3c; }
  .glass { fill: #9dc3e0; fill-opacity: 0.35; stroke: #6a97b7; }
  .head { fill: #1b7fb5; }
  @media (prefers-color-scheme: dark) {
    text { fill: #dce6f2; }
    .dim { fill: #93a4b8; }
    .beam { stroke: #5cc0f5; }
    .head { fill: #5cc0f5; }
    .rule { stroke: #7b8b9e; }
    .film { fill: #d4a253; }
    .glass { fill: #6f9ec4; stroke: #7fa8c6; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" class="head"/></marker></defs>

<rect x="95" y="150" width="500" height="22" class="film"/>
<rect x="95" y="172" width="500" height="60" class="glass"/>

<path d="M163 44L345 150" class="beam" marker-end="url(#arrow)"/>
<path d="M345 150L527 44" class="beam" marker-end="url(#arrow)"/>
<path d="M345 40V150" class="rule" stroke-dasharray="4 4"/>
<path d="M345 102A48 48 0 0 0 303 126" class="rule" stroke-width="2"/>
<text x="312" y="96" font-size="18">&#952;</text>
<text x="357" y="50" font-size="14" class="dim">法线</text>

<text x="76" y="30" font-size="16">偏振光入射</text>
<text x="470" y="30" font-size="17" font-weight="600">&#936;、&#916; 探测器</text>
<text x="614" y="167" font-size="16">薄膜：n、k、d</text>
<text x="614" y="207" font-size="16">已知基底</text>
<text x="26" y="278" font-size="15">角度 &#952; 按仪器实际使用值填写。不测量透射。</text>
<text x="26" y="300" font-size="13" class="dim">非按比例。</text>
</svg>
