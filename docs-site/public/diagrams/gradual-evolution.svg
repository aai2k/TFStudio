<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1080" viewBox="0 0 880 1080" role="img" aria-labelledby="t d">
<title id="t">The Gradual Evolution loop</title>
<desc id="d">A run prepares the merit rows and the starting design, then cycles. Each cycle resamples the band rows and runs a needle phase on each scanned side; a candidate that beats the working design is accepted. When none does, the design without its parked layers is tried as a new best, and otherwise a structural step is taken: a forced floor-thick layer at either end, freeing a layer, or with Deep search a perturbation of the best design. The run ends at Target MF, when the GE-step budget is used, or when nothing is left to try, and the best design is consolidated.</desc>
<style>
  /* No background is painted, so the page shows through in either theme, and
     the colours are read from the viewer's own light or dark setting. */
  text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #1c3350; font-size: 15px; text-anchor: middle; }
  .dim { fill: #5a6b80; font-size: 13px; }
  .lab { fill: #5a6b80; font-size: 13px; text-anchor: start; }
  .labR { fill: #5a6b80; font-size: 13px; text-anchor: end; }
  .box, .dec { fill: none; stroke: #4a6078; stroke-width: 1.4; }
  .end { fill: none; stroke: #4a6078; stroke-width: 2.4; }
  .flow { fill: none; stroke: #4a6078; stroke-width: 1.4; }
  .head, .dot { fill: #4a6078; }
  @media (prefers-color-scheme: dark) {
    text { fill: #dce6f2; }
    .dim, .lab, .labR { fill: #93a4b8; }
    .box, .dec, .end, .flow { stroke: #8fa3b8; }
    .head, .dot { fill: #8fa3b8; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" class="head"/></marker></defs>

<!-- Start -->
<rect x="180" y="12" width="120" height="34" rx="17" class="end"/>
<text x="240" y="34">Run</text>
<path d="M240 46V68" class="flow" marker-end="url(#arrow)"/>

<rect x="40" y="70" width="400" height="56" rx="4" class="box"/>
<text x="240" y="93">Prepare the merit rows</text>
<text x="240" y="114" class="dim">PPEF rows left out; MNT and MXT kept; bands sampled</text>
<path d="M240 126V146" class="flow" marker-end="url(#arrow)"/>

<rect x="40" y="148" width="400" height="94" rx="4" class="box"/>
<text x="240" y="170">Starting design: scored as it is (Preserve bulk)</text>
<text x="240" y="189">or refined, with the antireflection starts</text>
<text x="240" y="208">if Smart starting design is ticked</text>
<text x="240" y="231" class="dim">Row: Start or Seed</text>
<path d="M240 242V262" class="flow" marker-end="url(#arrow)"/>

<!-- Top of each cycle -->
<rect x="40" y="264" width="400" height="44" rx="4" class="box"/>
<text x="240" y="291">Resample band rows if the stack outgrew them</text>
<path d="M240 308V328" class="flow" marker-end="url(#arrow)"/>

<rect x="40" y="330" width="400" height="108" rx="4" class="box"/>
<text x="240" y="352">Needle phase, on each scanned side: scan P,</text>
<text x="240" y="371">keep the needles that fit Max layers; take</text>
<text x="240" y="390">batches of K, line-search, insert, refine</text>
<text x="240" y="409">in two passes, merge neighbours</text>
<text x="240" y="429" class="dim">Status: Scanning…, then Refining K candidates…</text>
<path d="M240 438V444" class="flow" marker-end="url(#arrow)"/>

<polygon points="110,482 240,446 370,482 240,518" class="dec"/>
<text x="240" y="478">Beats the</text>
<text x="240" y="496">working design?</text>
<path d="M240 518V546" class="flow" marker-end="url(#arrow)"/>
<text x="248" y="536" class="lab">yes</text>
<path d="M370 482H488" class="flow" marker-end="url(#arrow)"/>
<text x="380" y="474" class="lab">no</text>

<rect x="40" y="548" width="400" height="56" rx="4" class="box"/>
<text x="240" y="571">Accept it as the working design</text>
<text x="240" y="592" class="dim">Row: Needle, or Refine if the needle merged</text>
<path d="M240 604V628" class="flow" marker-end="url(#arrow)"/>

<polygon points="130,664 240,630 350,664 240,698" class="dec"/>
<text x="240" y="660">Best MF &lt;</text>
<text x="240" y="678">Target MF?</text>
<path d="M130 664H18V286H38" class="flow" marker-end="url(#arrow)"/>
<text x="122" y="656" class="labR">no</text>
<text x="12" y="480" class="dim" transform="rotate(-90 12 480)">next cycle</text>
<path d="M240 698V928" class="flow" marker-end="url(#arrow)"/>
<text x="248" y="716" class="lab">yes</text>
<text x="248" y="820" class="lab">Target MF reached</text>

<!-- Needle-optimal on every side -->
<rect x="490" y="452" width="350" height="60" rx="4" class="box"/>
<text x="665" y="475">Refine without layers parked on the floor</text>
<text x="665" y="498" class="dim">Kept only as a new best, as a Clean row</text>
<path d="M665 512V530" class="flow" marker-end="url(#arrow)"/>

<polygon points="585,562 665,532 745,562 665,592" class="dec"/>
<text x="665" y="567">New best?</text>
<path d="M585 562H470V664H352" class="flow" marker-end="url(#arrow)"/>
<text x="575" y="554" class="labR">yes</text>
<path d="M665 592V616" class="flow" marker-end="url(#arrow)"/>
<text x="673" y="608" class="lab">no</text>

<polygon points="555,652 665,618 775,652 665,686" class="dec"/>
<text x="665" y="648">GE steps left</text>
<text x="665" y="666">or Deep search?</text>
<path d="M665 686V710" class="flow" marker-end="url(#arrow)"/>
<text x="673" y="702" class="lab">yes</text>
<path d="M775 652H860V968H442" class="flow" marker-end="url(#arrow)"/>
<text x="785" y="644" class="lab">no</text>

<rect x="490" y="712" width="350" height="130" rx="4" class="box"/>
<text x="665" y="734">Structural step, the first that applies:</text>
<text x="665" y="753">forced: a floor-thick layer at either end;</text>
<text x="665" y="772">freeing: the layer that costs least removed;</text>
<text x="665" y="791">Deep search: the best design perturbed</text>
<text x="665" y="814" class="dim">Freeing comes first at Max layers</text>
<text x="665" y="832" class="dim">Rows: GE, Clean, Perturb</text>
<path d="M665 842V856" class="flow" marker-end="url(#arrow)"/>

<polygon points="585,888 665,858 745,888 665,918" class="dec"/>
<text x="665" y="893">Step taken?</text>
<path d="M585 888H470V664" class="flow"/>
<circle cx="470" cy="664" r="3.5" class="dot"/>
<text x="575" y="880" class="labR">yes</text>
<path d="M665 918V968" class="flow"/>
<circle cx="665" cy="968" r="3.5" class="dot"/>
<text x="673" y="936" class="lab">no</text>
<text x="852" y="988" class="labR">Max GE cycles reached</text>
<text x="657" y="988" class="labR">Nothing left to try</text>

<!-- Finish -->
<rect x="40" y="930" width="400" height="76" rx="4" class="box"/>
<text x="240" y="952">Consolidate on finish: take out layers while</text>
<text x="240" y="971">the MF stays within the tolerance, refining each</text>
<text x="240" y="994" class="dim">Row: Clean</text>
<path d="M240 1006V1028" class="flow" marker-end="url(#arrow)"/>
<rect x="120" y="1030" width="240" height="36" rx="18" class="end"/>
<text x="240" y="1053">Best design shown</text>
</svg>
