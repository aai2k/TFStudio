<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="t d">
<title id="t">Admittance locus of a two-layer V-coat on glass</title>
<desc id="d">Starting from glass at η_s = 1.52, the thin ZnS layer draws a short arc upward and the MgF₂ layer swings clockwise round most of a circle, ending with Y₀ exactly on air at η₀ = 1: zero reflectance. Every point of the dashed circle has the reflectance of bare glass.</desc>
