<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1032" viewBox="0 0 880 1032" role="img" aria-labelledby="t d">
<title id="t">The Structural Optimizer loop</title>
<desc id="d">A run prepares the merit rows and refines the starting design. Each iteration resamples the band rows and sets the temperature, proposes K changes (needle insertions and random mutations), refines and scores each one, then moves the chain to the lowest move when it beats the best design, or else to the first move that passes a Metropolis test. The run ends at Target MF, after Max iter iterations, or when no new best has come for a while; with Deep search it reheats from the best design instead.</desc>
<style>
  /* No background is painted, so the page shows through in either theme, and
     the colours are read from the viewer's own light or dark setting. */
  text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #1c3350; font-size: 15px; text-anchor: middle; }
  .dim { fill: #5a6b80; font-size: 13px; }
  .lab { fill: #5a6b80; font-size: 13px; text-anchor: start; }
  .labR { fill: #5a6b80; font-size: 13px; text-anchor: end; }
  .box, .dec { fill: none; stroke: #4a6078; stroke-width: 1.4; }
  .end { fill: none; stroke: #4a6078; stroke-width: 2.4; }
  .flow { fill: none; stroke: #4a6078; stroke-width: 1.4; }
  .head, .dot { fill: #4a6078; }
  @media (prefers-color-scheme: dark) {
    text { fill: #dce6f2; }
    .dim, .lab, .labR { fill: #93a4b8; }
    .box, .dec, .end, .flow { stroke: #8fa3b8; }
    .head, .dot { fill: #8fa3b8; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" class="head"/></marker></defs>

<!-- Start -->
<rect x="180" y="12" width="120" height="34" rx="17" class="end"/>
<text x="240" y="34">Run</text>
<path d="M240 46V68" class="flow" marker-end="url(#arrow)"/>

<rect x="40" y="70" width="400" height="56" rx="4" class="box"/>
<text x="240" y="93">Prepare the merit rows</text>
<text x="240" y="114" class="dim">PPEF rows left out; MNT and MXT set the thickness bounds</text>
<path d="M240 126V146" class="flow" marker-end="url(#arrow)"/>

<rect x="40" y="148" width="400" height="74" rx="4" class="box"/>
<text x="240" y="170">Refine the starting design, with the</text>
<text x="240" y="189">antireflection starts if Smart starting design</text>
<text x="240" y="211" class="dim">Row: Start or Seed</text>
<path d="M240 222V244" class="flow" marker-end="url(#arrow)"/>

<!-- Top of each iteration -->
<rect x="40" y="246" width="400" height="56" rx="4" class="box"/>
<text x="240" y="268">Resample band rows; the temperature T cools</text>
<text x="240" y="288">from T₀ toward 0.005·T₀ over Max iterations</text>
<path d="M240 302V324" class="flow" marker-end="url(#arrow)"/>

<rect x="40" y="326" width="400" height="94" rx="4" class="box"/>
<text x="240" y="348">K proposals, K = Threads: up to half are the</text>
<text x="240" y="367">best needle insertions, the rest random add,</text>
<text x="240" y="386">remove, split, merge or perturb</text>
<text x="240" y="409" class="dim">No add or split at Max layers</text>
<path d="M240 420V442" class="flow" marker-end="url(#arrow)"/>

<rect x="40" y="444" width="400" height="72" rx="4" class="box"/>
<text x="240" y="466">Refine each, tidy it, score it on every row;</text>
<text x="240" y="485">one back at the current design is no move</text>
<text x="240" y="506" class="dim">Status: Refining K proposals (parallel)…</text>
<path d="M240 516V520" class="flow" marker-end="url(#arrow)"/>

<polygon points="110,558 240,522 370,558 240,594" class="dec"/>
<text x="240" y="554">Lowest move</text>
<text x="240" y="572">beats the best?</text>
<path d="M240 594V620" class="flow" marker-end="url(#arrow)"/>
<text x="248" y="612" class="lab">yes</text>
<path d="M370 558H488" class="flow" marker-end="url(#arrow)"/>
<text x="380" y="550" class="lab">no</text>

<rect x="40" y="622" width="400" height="56" rx="4" class="box"/>
<text x="240" y="645">The chain moves to it, a new best</text>
<text x="240" y="666" class="dim">Row: named by the mutation that made it</text>
<path d="M240 678V694" class="flow" marker-end="url(#arrow)"/>

<rect x="490" y="522" width="350" height="72" rx="4" class="box"/>
<text x="665" y="544">Metropolis test on each move, in random</text>
<text x="665" y="563">order; the chain moves to the first passed</text>
<text x="665" y="584" class="dim">or stays where it is</text>
<path d="M665 594V686H240" class="flow"/>
<circle cx="240" cy="686" r="3.5" class="dot"/>

<polygon points="130,730 240,696 350,730 240,764" class="dec"/>
<text x="240" y="726">Best MF &lt;</text>
<text x="240" y="744">Target MF?</text>
<path d="M350 730H518" class="flow" marker-end="url(#arrow)"/>
<text x="360" y="722" class="lab">yes</text>
<rect x="520" y="712" width="200" height="36" rx="18" class="end"/>
<text x="620" y="735">Target MF reached</text>
<path d="M240 764V784" class="flow" marker-end="url(#arrow)"/>
<text x="248" y="778" class="lab">no</text>

<polygon points="110,820 240,786 370,820 240,854" class="dec"/>
<text x="240" y="816">No new best</text>
<text x="240" y="834">for P iterations?</text>
<path d="M370 820H518" class="flow" marker-end="url(#arrow)"/>
<text x="380" y="812" class="lab">yes</text>
<path d="M240 854V884" class="flow" marker-end="url(#arrow)"/>
<text x="248" y="872" class="lab">no</text>

<polygon points="520,820 600,788 680,820 600,852" class="dec"/>
<text x="600" y="825">Deep search?</text>
<path d="M680 820H710" class="flow" marker-end="url(#arrow)"/>
<text x="684" y="812" class="lab">no</text>
<rect x="712" y="802" width="140" height="36" rx="18" class="end"/>
<text x="782" y="825">Stalled, stop</text>
<path d="M600 852V876" class="flow" marker-end="url(#arrow)"/>
<text x="608" y="868" class="lab">yes</text>

<rect x="490" y="878" width="350" height="76" rx="4" class="box"/>
<text x="665" y="900">Reheat: 1 to 3 mutations of the best,</text>
<text x="665" y="919">three times the jitter, refined, T back to T₀</text>
<text x="665" y="942" class="dim">Row: Perturb if it is a new best</text>
<path d="M840 916H870V274H442" class="flow" marker-end="url(#arrow)"/>

<polygon points="130,920 240,886 350,920 240,954" class="dec"/>
<text x="240" y="916">Iterations</text>
<text x="240" y="934">left?</text>
<path d="M130 920H18V274H38" class="flow" marker-end="url(#arrow)"/>
<text x="122" y="912" class="labR">yes</text>
<text x="12" y="600" class="dim" transform="rotate(-90 12 600)">next iteration</text>
<path d="M240 954V980" class="flow" marker-end="url(#arrow)"/>
<text x="248" y="972" class="lab">no</text>
<rect x="120" y="982" width="240" height="36" rx="18" class="end"/>
<text x="240" y="1005">Max iterations reached</text>
</svg>
