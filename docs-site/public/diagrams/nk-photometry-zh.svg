<svg xmlns="http://www.w3.org/2000/svg" width="800" height="366" viewBox="0 0 800 366" role="img" aria-labelledby="t d">
<title id="t">在两面抛光玻璃平板上测量单层膜的 R 与 T</title>
<desc id="d">光从膜面入射。R 是从镀膜面反射出去的光束，T 是穿过未镀膜的玻璃背面之后出射的光束。玻璃内部往返的反射也计入本窗口的计算。</desc>
<style>
  /* No background is painted, so the page shows through in either theme, and
     the colours are read from the viewer's own light or dark setting. */
  text { font-family: system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif; fill: #1c3350; }
  .dim { fill: #5a6b80; }
  .beam { stroke: #1b7fb5; fill: none; stroke-width: 3; }
  .weak { stroke: #1b7fb5; fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
  .rule { stroke: #8494a6; fill: none; }
  .film { fill: #c08c3c; }
  .glass { fill: #9dc3e0; fill-opacity: 0.35; stroke: #6a97b7; }
  .head { fill: #1b7fb5; }
  @media (prefers-color-scheme: dark) {
    text { fill: #dce6f2; }
    .dim { fill: #93a4b8; }
    .beam, .weak { stroke: #5cc0f5; }
    .head { fill: #5cc0f5; }
    .rule { stroke: #7b8b9e; }
    .film { fill: #d4a253; }
    .glass { fill: #6f9ec4; stroke: #7fa8c6; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" class="head"/></marker></defs>

<rect x="95" y="150" width="500" height="24" class="film"/>
<rect x="95" y="174" width="500" height="98" class="glass"/>

<path d="M274 50L310 150" class="beam" marker-end="url(#arrow)"/>
<path d="M310 150L346 50" class="beam" marker-end="url(#arrow)"/>
<path d="M310 150L338 272L358 328" class="beam" marker-end="url(#arrow)"/>
<path d="M338 272L360 174L382 272" class="weak" marker-end="url(#arrow)"/>
<path d="M310 42V150" class="rule" stroke-dasharray="4 4"/>

<text x="262" y="46" font-size="16" text-anchor="end">光从膜面入射</text>
<text x="354" y="48" font-size="17" font-weight="600">R</text>
<text x="366" y="326" font-size="17" font-weight="600">T</text>
<text x="310" y="34" font-size="14" text-anchor="middle" class="dim">法线</text>

<text x="614" y="168" font-size="16">薄膜：n、k、d</text>
<text x="614" y="214" font-size="16">已知玻璃</text>
<text x="614" y="236" font-size="14" class="dim">两面抛光</text>
<path d="M597 271H630" class="rule"/><text x="638" y="276" font-size="14" class="dim">未镀膜</text>
<text x="116" y="222" font-size="14" class="dim">玻璃内部的反射</text>
<text x="116" y="242" font-size="14" class="dim">已计入计算</text>
<text x="26" y="354" font-size="13" class="dim">非按比例。</text>
</svg>
