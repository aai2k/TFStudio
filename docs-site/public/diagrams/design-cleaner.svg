<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="t d">
<title id="t">What Design Cleaner does</title>
<desc id="d">On each side cleaned, neighbours of one material are merged and unlocked layers thinner than the threshold are removed, repeated while a pass removes something, up to four passes, then merged once more. The window previews the result. Apply optionally refines the cleaned design with the chosen method and writes it as one undo step.</desc>
<style>
  /* No background is painted, so the page shows through in either theme, and
     the colours are read from the viewer's own light or dark setting. */
  text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #1c3350; font-size: 15px; text-anchor: middle; }
  .dim { fill: #5a6b80; font-size: 13px; }
  .lab { fill: #5a6b80; font-size: 13px; text-anchor: start; }
  .labR { fill: #5a6b80; font-size: 13px; text-anchor: end; }
  .box, .dec { fill: none; stroke: #4a6078; stroke-width: 1.4; }
  .end { fill: none; stroke: #4a6078; stroke-width: 2.4; }
  .flow { fill: none; stroke: #4a6078; stroke-width: 1.4; }
  .head { fill: #4a6078; }
  @media (prefers-color-scheme: dark) {
    text { fill: #dce6f2; }
    .dim, .lab, .labR { fill: #93a4b8; }
    .box, .dec, .end, .flow { stroke: #8fa3b8; }
    .head { fill: #8fa3b8; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" class="head"/></marker></defs>

<rect x="220" y="12" width="160" height="34" rx="17" class="end"/>
<text x="300" y="34">Design on screen</text>
<path d="M300 46V68" class="flow" marker-end="url(#arrow)"/>

<rect x="80" y="70" width="440" height="56" rx="4" class="box"/>
<text x="300" y="92">On each side cleaned (the Side setting;</text>
<text x="300" y="111">a symmetric design cleans its front)</text>
<path d="M300 126V148" class="flow" marker-end="url(#arrow)"/>

<rect x="80" y="150" width="440" height="56" rx="4" class="box"/>
<text x="300" y="173">Merge neighbours of one material</text>
<text x="300" y="194" class="dim">If Merge same material is on; a locked layer is never merged</text>
<path d="M300 206V228" class="flow" marker-end="url(#arrow)"/>

<rect x="80" y="230" width="440" height="44" rx="4" class="box"/>
<text x="300" y="257">Remove unlocked layers thinner than Remove below</text>
<path d="M300 274V284" class="flow" marker-end="url(#arrow)"/>

<polygon points="170,318 300,286 430,318 300,350" class="dec"/>
<text x="300" y="314">Removed any, in</text>
<text x="300" y="332">under 4 passes?</text>
<path d="M170 318H40V178H78" class="flow" marker-end="url(#arrow)"/>
<text x="162" y="310" class="labR">yes</text>
<path d="M300 350V376" class="flow" marker-end="url(#arrow)"/>
<text x="308" y="368" class="lab">no</text>

<rect x="80" y="378" width="440" height="44" rx="4" class="box"/>
<text x="300" y="405">Merge once more</text>
<path d="M300 422V444" class="flow" marker-end="url(#arrow)"/>

<rect x="80" y="446" width="440" height="78" rx="4" class="box"/>
<text x="300" y="468">Preview: the operations, the MF before</text>
<text x="300" y="487">and after, the layers below the threshold</text>
<text x="300" y="512" class="dim">Nothing changes until Apply</text>
<path d="M300 524V546" class="flow" marker-end="url(#arrow)"/>

<rect x="230" y="548" width="140" height="36" rx="18" class="end"/>
<text x="300" y="571">Apply</text>
<path d="M300 584V594" class="flow" marker-end="url(#arrow)"/>

<polygon points="190,628 300,596 410,628 300,660" class="dec"/>
<text x="300" y="633">Re-optimize?</text>
<path d="M300 660V684" class="flow" marker-end="url(#arrow)"/>
<text x="308" y="676" class="lab">yes</text>
<path d="M410 628H600V814H522" class="flow" marker-end="url(#arrow)"/>
<text x="420" y="620" class="lab">no</text>

<rect x="80" y="686" width="440" height="76" rx="4" class="box"/>
<text x="300" y="708">Refine with Method, up to Max iter steps,</text>
<text x="300" y="727">no layer below max(Remove below, 1 nm)</text>
<text x="300" y="750" class="dim">In the background; Stop keeps the best so far</text>
<path d="M300 762V784" class="flow" marker-end="url(#arrow)"/>

<rect x="80" y="786" width="440" height="56" rx="4" class="box"/>
<text x="300" y="809">Write the design as one undo step</text>
<text x="300" y="830" class="dim">A symmetric back is the mirror of the front</text>
</svg>
