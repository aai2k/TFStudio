<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:">
    <title>TFStudio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
</head>
<body>
    <div id="root"></div>

    <!-- React (UMD builds - global) -->
    <script src="../node_modules/react/umd/react.development.js"></script>
    <script src="../node_modules/react-dom/umd/react-dom.development.js"></script>

    <!-- Apache ECharts for scientific charts (ECharts-GL adds 3D surfaces) -->
    <script src="../node_modules/echarts/dist/echarts.min.js"></script>
    <script src="../node_modules/echarts-gl/dist/echarts-gl.min.js"></script>

    <!-- KaTeX for LaTeX formula rendering -->
    <script src="../node_modules/katex/dist/katex.min.js"></script>

    <!-- CodeMirror, the Script Console's editor, as ES modules from node_modules.
         The packaged app and the web demo have it bundled into renderer.js
         (tools/build-renderer.mjs). tests/script_console_editor.mjs checks that
         this map names every package the editor's modules import, at the file
         the bundle takes. -->
    <script type="importmap">
    {
      "imports": {
        "@codemirror/autocomplete": "../node_modules/@codemirror/autocomplete/dist/index.js",
        "@codemirror/commands": "../node_modules/@codemirror/commands/dist/index.js",
        "@codemirror/lang-javascript": "../node_modules/@codemirror/lang-javascript/dist/index.js",
        "@codemirror/lang-python": "../node_modules/@codemirror/lang-python/dist/index.js",
        "@codemirror/language": "../node_modules/@codemirror/language/dist/index.js",
        "@codemirror/search": "../node_modules/@codemirror/search/dist/index.js",
        "@codemirror/state": "../node_modules/@codemirror/state/dist/index.js",
        "@codemirror/streamparser": "../node_modules/@codemirror/streamparser/dist/index.js",
        "@codemirror/view": "../node_modules/@codemirror/view/dist/index.js",
        "@lezer/common": "../node_modules/@lezer/common/dist/index.js",
        "@lezer/highlight": "../node_modules/@lezer/highlight/dist/index.js",
        "@lezer/javascript": "../node_modules/@lezer/javascript/dist/index.js",
        "@lezer/lr": "../node_modules/@lezer/lr/dist/index.js",
        "@lezer/python": "../node_modules/@lezer/python/dist/index.js",
        "@marijn/find-cluster-break": "../node_modules/@marijn/find-cluster-break/src/index.js",
        "crelt": "../node_modules/crelt/index.js",
        "style-mod": "../node_modules/style-mod/src/style-mod.js",
        "w3c-keyname": "../node_modules/w3c-keyname/index.js"
      }
    }
    </script>

    <!-- Main app (ES6 module) -->
    <script type="module" src="renderer.js"></script>
</body>
</html>
